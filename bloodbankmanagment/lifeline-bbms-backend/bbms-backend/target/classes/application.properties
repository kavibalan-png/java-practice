spring.application.name=bbms

# ---- MySQL ----
spring.datasource.url=jdbc:mysql://localhost:3306/bbms_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Run schema.sql / data.sql after Hibernate creates tables (set to always only on first run)
spring.sql.init.mode=never

# ---- Server ----
server.port=8080

# ---- JWT ----
app.jwt.secret=change-this-super-secret-key-in-production-min-32-chars
app.jwt.expiration-ms=86400000

# ---- Mail (for low-stock / availability notifications) ----
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ---- CORS (frontend origin) ----
app.cors.allowed-origins=http://localhost:3000,http://localhost:5500
